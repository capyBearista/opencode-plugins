name: Feature Request
description: Suggest an enhancement for an existing plugin or this monorepo itself
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to suggest an enhancement!
  - type: checkboxes
    id: preflight
    attributes:
      label: Pre-flight checklist
      options:
        - label: I have searched existing issues to avoid duplicates
          required: true
        - label: I have checked the relevant README for existing capabilities
          required: true
  - type: dropdown
    id: plugin
    attributes:
      label: Which plugin is this for?
      description: Select the plugin you'd like to see enhanced.
      options:
        - Select
        - opencode-agents-loader
        - opencode-double-tap-timeline
        - opencode-output-styles
        - opencode-plugins (this monorepo itself)
    validations:
      required: true
  - type: dropdown
    id: request-type
    attributes:
      label: Is your request related to a problem or bug with the selected option?
      options:
        - "No — I have an idea for a new capability"
        - "Yes — please open a bug report issue :)"
      default: 0
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What would you like to see?
      description: Describe the enhancement you'd like added.
      placeholder: I'd love to be able to...
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Describe the solution you'd like
      description: A clear and concise description of what you want to happen.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Describe alternatives you've considered
      description: Share any other approaches, workarounds, plugins, and tools you considered.
  - type: input
    id: plugin-version
    attributes:
      label: Plugin Version
      description: What version of the plugin are you running? Leave blank if this is about the monorepo.
      placeholder: e.g., 1.0.0
    validations:
      required: false
  - type: input
    id: opencode-version
    attributes:
      label: OpenCode Version
      description: What version of OpenCode are you using?
      placeholder: e.g., 1.14.33
    validations:
      required: false
  - type: dropdown
    id: os
    attributes:
      label: Operating System
      description: What OS are you running?
      options:
        - Select
        - Linux
        - macOS
        - Windows
        - Other
    validations:
      required: false
  - type: upload
    id: mockups
    attributes:
      label: Upload mockups or examples
      description: Add images or reference files to help illustrate your idea.
    validations:
      required: false
