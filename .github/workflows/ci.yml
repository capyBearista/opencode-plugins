name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.github/assets/**'
      - '.changeset/**'
      - 'CONTRIBUTING.md'
      - 'LICENSE*'
  pull_request:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.github/assets/**'
      - '.changeset/**'
      - 'CONTRIBUTING.md'
      - 'LICENSE*'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.12

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.bun/install/cache
            ${{ github.workspace }}/.turbo
          key: ${{ runner.os }}-bun-turbo-${{ hashFiles('**/bun.lockb') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-bun-turbo-${{ hashFiles('**/bun.lockb') }}-
            ${{ runner.os }}-bun-turbo-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint & format
        run: bun run lint

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun run test --cache-dir=".turbo"

