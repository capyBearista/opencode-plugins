name: Changesets

# ci.yml skips changeset-only pushes and PRs, so the class-major rule runs here instead.
on:
  pull_request:
    branches: [main]
    paths:
      - '.changeset/**'
      - 'packages/*/package.json'
      - 'tools/release-channels.json'
      - 'tools/release-channel-guard.ts'
      - '.github/workflows/changesets.yml'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  class-major:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6  # v2.2.0
        with:
          bun-version: 1.3.12

      - name: Check pending changesets
        run: bun run release:changesets
