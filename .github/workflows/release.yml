name: Release

on:
  push:
    branches:
      - main
    paths:
      - 'packages/**'
      - '.changeset/**'
      - 'bun.lock'
      - 'package.json'
      - 'turbo.json'
      - 'tsconfig*.json'
      - '.github/workflows/release.yml'
      - '.github/workflows/ci.yml'
      - 'tools/**'

permissions:
  contents: write
  pull-requests: write
  id-token: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    environment: npm-publish
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e  # v6.4.0
        with:
          node-version: '24.11.1'
          registry-url: https://registry.npmjs.org/

      - name: Pin npm
        run: npm install --global npm@11.19.0

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6  # v2.2.0
        with:
          bun-version: 1.3.12

      - name: Verify pinned release toolchain
        shell: bash
        run: |
          test "$(node --version)" = "v24.11.1"
          test "$(npm --version)" = "11.19.0"
          test "$(bun --version)" = "1.3.12"
          echo "RELEASE_NODE_VERSION=$(node --version | tr -d 'v')" >> "$GITHUB_ENV"
          echo "RELEASE_NPM_VERSION=$(npm --version)" >> "$GITHUB_ENV"
          echo "RELEASE_BUN_VERSION=$(bun --version)" >> "$GITHUB_ENV"

      - name: Cache dependencies
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae  # v5.0.5
        with:
          path: |
            ~/.bun/install/cache
            ${{ github.workspace }}/.turbo
          key: ${{ runner.os }}-bun-turbo-${{ hashFiles('**/bun.lock') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-bun-turbo-${{ hashFiles('**/bun.lock') }}-
            ${{ runner.os }}-bun-turbo-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Create Release Pull Request or Publish to NPM
        id: changesets
        uses: changesets/action@63a615b9cd06ba9a3e6d13796c7fbcb080a60a0b  # v1.8.0
        with:
          # This expects a script named "changeset:publish" in root package.json
          publish: bun run changeset:publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_CONFIG_REGISTRY: https://registry.npmjs.org/
          NPM_CONFIG_PROVENANCE: true
          HUSKY: "0"
