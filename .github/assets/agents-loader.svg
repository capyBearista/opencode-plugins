<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="400" viewBox="0 0 1280 400" role="img" aria-labelledby="diagram-title diagram-desc">
  <title id="diagram-title">How opencode-agents-loader works</title>
  <desc id="diagram-desc">Global and project-level .agents directories are connected through opencode-agents-loader to corresponding native OpenCode directories using managed relative symbolic links. Original files are preserved and native OpenCode configuration takes precedence.</desc>

  <defs>
    <pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#808080" opacity="0.14" />
    </pattern>
    <marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 2 2 L 10 6 L 2 10" fill="none" stroke="#fab283" stroke-width="2" stroke-linecap="square" stroke-linejoin="miter" />
    </marker>
    <style>
      .sans { font-family: "JetBrains Mono"; }
      .mono { font-family: "JetBrains Mono"; }
      .section { font-size: 14px; font-weight: 750; letter-spacing: 2.3px; }
      .path { font-size: 23px; font-weight: 650; letter-spacing: -0.7px; }
      .file { font-size: 15px; fill: #b5b5b5; }
    </style>
  </defs>

  <!-- Canvas -->
  <rect width="1280" height="400" fill="#0a0a0a" />
  <rect width="1280" height="400" fill="url(#dots)" />

  <!-- Heading -->
  <text x="61" y="42" class="sans" fill="#b5b5b5" font-size="17">Use shared agent and command definitions without moving or duplicating their files.</text>
  <path d="M60 69 H1220" stroke="#484848" stroke-width="1" opacity="0.9" />

  <!-- Column headings -->
  <text x="60" y="104" class="sans section" fill="#fab283">01  SOURCE DIRECTORIES</text>
  <text x="440" y="104" class="sans section" fill="#fab283">02  THE BRIDGE</text>
  <text x="868" y="104" class="sans section" fill="#fab283">03  OPENCODE DISCOVERY</text>

  <!-- Global .agents source -->
  <rect x="60" y="114" width="350" height="120" fill="#141414" stroke="#484848" stroke-width="1.3" />
  <rect x="78" y="126" width="78" height="21" fill="#1e1e1e" />
  <text x="117" y="141" class="sans" font-size="11" font-weight="750" fill="#fab283" text-anchor="middle" letter-spacing="0.9">GLOBAL</text>
  <text x="80" y="177" class="mono path" fill="#eeeeee">~/.agents/</text>
  <path d="M80 189 H387" stroke="#484848" stroke-width="1" />
  <rect x="79" y="199" width="144" height="28" fill="#1e1e1e" />
  <rect x="235" y="199" width="151" height="28" fill="#1e1e1e" />
  <text x="91" y="217" class="mono file">agents/*.md</text>
  <text x="250" y="217" class="mono file">commands/*.md</text>

  <!-- Project .agents source -->
  <rect x="60" y="242" width="350" height="120" fill="#141414" stroke="#484848" stroke-width="1.3" />
  <rect x="78" y="254" width="87" height="21" fill="#1e1e1e" />
  <text x="121" y="269" class="sans" font-size="11" font-weight="750" fill="#fab283" text-anchor="middle" letter-spacing="0.9">PROJECT</text>
  <text x="80" y="305" class="mono path" fill="#eeeeee">.agents/</text>
  <path d="M80 317 H387" stroke="#484848" stroke-width="1" />
  <rect x="79" y="327" width="144" height="28" fill="#1e1e1e" />
  <rect x="235" y="327" width="151" height="28" fill="#1e1e1e" />
  <text x="91" y="345" class="mono file">agents/*.md</text>
  <text x="250" y="345" class="mono file">commands/*.md</text>

  <!-- Global native destination -->
  <rect x="868" y="114" width="352" height="120" fill="#141414" stroke="#484848" stroke-width="1.3" />
  <rect x="887" y="126" width="78" height="21" fill="#1e1e1e" />
  <text x="926" y="141" class="sans" font-size="11" font-weight="750" fill="#fab283" text-anchor="middle" letter-spacing="0.9">GLOBAL</text>
  <text x="886" y="170" class="mono" font-size="18" font-weight="650" fill="#eeeeee">~/.config/opencode/</text>
  <text x="888" y="184" class="mono" font-size="11" fill="#808080">($OPENCODE_CONFIG_DIR/)</text>
  <path d="M887 189 H1199" stroke="#484848" stroke-width="1" />
  <rect x="887" y="199" width="143" height="28" fill="#1e1e1e" />
  <rect x="1042" y="199" width="157" height="28" fill="#1e1e1e" />
  <text x="900" y="217" class="mono file">agents/*.md</text>
  <text x="1055" y="217" class="mono file">commands/*.md</text>

  <!-- Project native destination -->
  <rect x="868" y="242" width="352" height="120" fill="#141414" stroke="#484848" stroke-width="1.3" />
  <rect x="887" y="254" width="87" height="21" fill="#1e1e1e" />
  <text x="930" y="269" class="sans" font-size="11" font-weight="750" fill="#fab283" text-anchor="middle" letter-spacing="0.9">PROJECT</text>
  <text x="887" y="305" class="mono path" fill="#eeeeee">.opencode/</text>
  <path d="M887 317 H1199" stroke="#484848" stroke-width="1" />
  <rect x="887" y="327" width="143" height="28" fill="#1e1e1e" />
  <rect x="1042" y="327" width="157" height="28" fill="#1e1e1e" />
  <text x="900" y="345" class="mono file">agents/*.md</text>
  <text x="1055" y="345" class="mono file">commands/*.md</text>

  <!-- Two scoped flows -->
  <path d="M411 174 H440" fill="none" stroke="#fab283" stroke-width="2.5" stroke-linecap="square" />
  <circle cx="413" cy="174" r="4" fill="#fab283" />
  <path d="M840 174 H865" fill="none" stroke="#fab283" stroke-width="2.5" stroke-linecap="square" marker-end="url(#arrow)" />

  <path d="M411 302 H440" fill="none" stroke="#fab283" stroke-width="2.5" stroke-linecap="square" />
  <circle cx="413" cy="302" r="4" fill="#fab283" />
  <path d="M840 302 H865" fill="none" stroke="#fab283" stroke-width="2.5" stroke-linecap="square" marker-end="url(#arrow)" />

  <!-- Bridge card -->
  <rect x="440" y="137" width="400" height="203" fill="#141414" stroke="#fab283" stroke-width="1.5" />
  <rect x="563" y="149" width="153" height="25" fill="#1e1e1e" />
  <text x="639.5" y="166" class="sans" text-anchor="middle" font-size="11" font-weight="780" fill="#fab283" letter-spacing="1.2">PLUGIN</text>
  <text x="639.5" y="211" class="sans" text-anchor="middle" fill="#eeeeee" font-size="19" font-weight="730" letter-spacing="-0.5">opencode-agents-loader</text>
  <text x="639.5" y="242" class="sans" text-anchor="middle" fill="#b5b5b5" font-size="15">Creates managed relative symlinks</text>
  <path d="M465 252 H815" stroke="#484848" stroke-width="1" />
  <circle cx="493" cy="275" r="4" fill="#fab283" />
  <text x="508" y="280" class="sans" fill="#eeeeee" font-size="14">Preserves original file contents</text>
  <circle cx="493" cy="306" r="4" fill="#fab283" />
  <text x="508" y="311" class="sans" fill="#eeeeee" font-size="14">Leaves native entries untouched</text>
</svg>