<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="400" viewBox="0 0 1280 400" role="img" aria-labelledby="diagram-title diagram-desc">
  <title id="diagram-title">How opencode-agents-loader works</title>
  <desc id="diagram-desc">Global and project-level .agents directories are connected through opencode-agents-loader to corresponding native OpenCode directories using managed relative symbolic links. Original files are preserved and native OpenCode configuration takes precedence.</desc>

  <defs>
    <pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#71839c" opacity="0.14" />
    </pattern>
    <marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 2 2 L 10 6 L 2 10" fill="none" stroke="#72e2da" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
    </marker>
    <style>
      .sans { font-family: "JetBrains Mono"; }
      .mono { font-family: "JetBrains Mono"; }
      .section { font-size: 12px; font-weight: 750; letter-spacing: 2.3px; }
      .path { font-size: 23px; font-weight: 650; letter-spacing: -0.7px; }
      .file { font-size: 15px; fill: #c5d0e3; }
    </style>
  </defs>

  <!-- Canvas: flat fills, original palette -->
  <rect width="1280" height="400" fill="#0c1222" />
  <rect width="1280" height="400" fill="url(#dots)" />

  <!-- Heading -->
  <text x="61" y="42" class="sans" fill="#9babc5" font-size="17">Use shared agent and command definitions without moving or duplicating their files.</text>
  <path d="M60 69 H1220" stroke="#36445e" stroke-width="1" opacity="0.62" />

  <!-- Column headings -->
  <text x="60" y="101" class="sans section" fill="#b5a4ff">01  SOURCE DIRECTORIES</text>
  <text x="440" y="101" class="sans section" fill="#86b9ff">02  THE BRIDGE</text>
  <text x="868" y="101" class="sans section" fill="#78e8d9">03  OPENCODE DISCOVERY</text>

  <!-- Global .agents source -->
  <rect x="60" y="117" width="350" height="112" rx="15" fill="#171b31" stroke="#6a5aa2" stroke-width="1.3" />
  <rect x="78" y="128" width="78" height="21" rx="6" fill="#352a58" />
  <text x="117" y="143" class="sans" font-size="11" font-weight="750" fill="#c3b0ff" text-anchor="middle" letter-spacing="0.9">GLOBAL</text>
  <text x="80" y="174" class="mono path" fill="#f0ecff">~/.agents/</text>
  <path d="M80 185 H387" stroke="#3f3a62" stroke-width="1" />
  <rect x="79" y="193" width="144" height="28" rx="8" fill="#23233c" />
  <rect x="235" y="193" width="151" height="28" rx="8" fill="#23233c" />
  <text x="91" y="211" class="mono file">agents/*.md</text>
  <text x="250" y="211" class="mono file">commands/*.md</text>

  <!-- Project .agents source -->
  <rect x="60" y="245" width="350" height="112" rx="15" fill="#171b31" stroke="#6a5aa2" stroke-width="1.3" />
  <rect x="78" y="256" width="87" height="21" rx="6" fill="#352a58" />
  <text x="121" y="271" class="sans" font-size="11" font-weight="750" fill="#c3b0ff" text-anchor="middle" letter-spacing="0.9">PROJECT</text>
  <text x="80" y="302" class="mono path" fill="#f0ecff">.agents/</text>
  <path d="M80 313 H387" stroke="#3f3a62" stroke-width="1" />
  <rect x="79" y="321" width="144" height="28" rx="8" fill="#23233c" />
  <rect x="235" y="321" width="151" height="28" rx="8" fill="#23233c" />
  <text x="91" y="339" class="mono file">agents/*.md</text>
  <text x="250" y="339" class="mono file">commands/*.md</text>

  <!-- Global native destination -->
  <rect x="868" y="117" width="352" height="112" rx="15" fill="#10282f" stroke="#328b87" stroke-width="1.3" />
  <rect x="887" y="128" width="78" height="21" rx="6" fill="#194a49" />
  <text x="926" y="143" class="sans" font-size="11" font-weight="750" fill="#8ff5e0" text-anchor="middle" letter-spacing="0.9">GLOBAL</text>
  <text x="886" y="167" class="mono" font-size="18" font-weight="650" fill="#e5fcf7">~/.config/opencode/</text>
  <text x="888" y="181" class="mono" font-size="11" fill="#729e9c">($OPENCODE_CONFIG_DIR/)</text>
  <path d="M887 185 H1199" stroke="#27575a" stroke-width="1" />
  <rect x="887" y="193" width="143" height="28" rx="8" fill="#153b3c" />
  <rect x="1042" y="193" width="157" height="28" rx="8" fill="#153b3c" />
  <text x="900" y="211" class="mono file">agents/*.md</text>
  <text x="1055" y="211" class="mono file">commands/*.md</text>

  <!-- Project native destination -->
  <rect x="868" y="245" width="352" height="112" rx="15" fill="#10282f" stroke="#328b87" stroke-width="1.3" />
  <rect x="887" y="256" width="87" height="21" rx="6" fill="#194a49" />
  <text x="930" y="271" class="sans" font-size="11" font-weight="750" fill="#8ff5e0" text-anchor="middle" letter-spacing="0.9">PROJECT</text>
  <text x="887" y="302" class="mono path" fill="#e5fcf7">.opencode/</text>
  <path d="M887 313 H1199" stroke="#27575a" stroke-width="1" />
  <rect x="887" y="321" width="143" height="28" rx="8" fill="#153b3c" />
  <rect x="1042" y="321" width="157" height="28" rx="8" fill="#153b3c" />
  <text x="900" y="339" class="mono file">agents/*.md</text>
  <text x="1055" y="339" class="mono file">commands/*.md</text>

  <!-- Two scoped flows -->
  <path d="M411 173 H440" fill="none" stroke="#a795f7" stroke-width="2.5" stroke-linecap="round" />
  <circle cx="413" cy="173" r="4" fill="#a795f7" />
  <path d="M840 173 H865" fill="none" stroke="#72e2da" stroke-width="2.5" stroke-linecap="round" marker-end="url(#arrow)" />
  <path d="M411 301 H440" fill="none" stroke="#a795f7" stroke-width="2.5" stroke-linecap="round" />
  <circle cx="413" cy="301" r="4" fill="#a795f7" />
  <path d="M840 301 H865" fill="none" stroke="#72e2da" stroke-width="2.5" stroke-linecap="round" marker-end="url(#arrow)" />

  <!-- Bridge card: widened to keep JetBrains Mono labels inside -->
  <rect x="440" y="137" width="400" height="203" rx="18" fill="#182b48" stroke="#457caf" stroke-width="1.5" />
  <rect x="563" y="149" width="153" height="25" rx="12" fill="#213b63" stroke="#4a7fb4" stroke-opacity="0.6" />
  <text x="639.5" y="166" class="sans" text-anchor="middle" font-size="11" font-weight="780" fill="#a6cfff" letter-spacing="1.2">PLUGIN</text>
  <text x="639.5" y="211" class="sans" text-anchor="middle" fill="#f4f8ff" font-size="19" font-weight="730" letter-spacing="-0.5">opencode-agents-loader</text>
  <text x="639.5" y="242" class="sans" text-anchor="middle" fill="#aec3de" font-size="15">Creates managed relative symlinks</text>
  <path d="M465 252 H815" stroke="#3d557a" stroke-width="1" />
  <circle cx="493" cy="275" r="4" fill="#82edcf" />
  <text x="508" y="280" class="sans" fill="#d5e2f5" font-size="14">Preserves original file contents</text>
  <circle cx="493" cy="306" r="4" fill="#82edcf" />
  <text x="508" y="311" class="sans" fill="#d5e2f5" font-size="14">Leaves native entries untouched</text>
</svg>
