
<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="600" viewBox="0 0 1280 600" role="img" aria-labelledby="diagram-title diagram-desc">
  <title id="diagram-title">OpenCode V2 plugin architecture</title>
  <desc id="diagram-desc">Three server-installed plugins: Adversarial Review, Agents Loader, and Output Styles. Two TUI-installed plugins: RAM Monitor and Double-Tap Timeline. Output Styles provides both server and TUI functionality from one opencode.json entry; its TUI half loads automatically without a cli.json entry.</desc>

  <defs>
    <style>
      text { font-family: "JetBrains Mono"; font-weight: 500; }
      .title { font-size: 30px; font-weight: 750; letter-spacing: -0.6px; }
      .subtitle { font-size: 14px; fill: #808080; }
      .section { font-size: 22px; font-weight: 750; }
      .label { font-size: 16px; font-weight: 700; fill: #eeeeee; }
      .body { font-size: 14px; fill: #b5b5b5; }
      .small { font-size: 12px; fill: #808080; }
      .code { font-size: 13px; fill: #eeeeee; }
      .pkg { font-size: 13px; fill: #5c9cf5; }
    </style>
  </defs>

  <!-- Canvas and heading -->
  <rect width="1280" height="600" fill="#0a0a0a"/>
  <text x="640" y="48" class="title" fill="#eeeeee" text-anchor="middle">OpenCode V2 plugin architecture</text>
  <text x="640" y="77" class="subtitle" text-anchor="middle">Server and TUI plugins are configured separately—with one important exception.</text>

  <!-- Column shells -->
  <rect x="24" y="103" width="608" height="460" fill="#141414" stroke="#fab283" stroke-width="1.5"/>
  <rect x="648" y="103" width="608" height="460" fill="#141414" stroke="#5c9cf5" stroke-width="1.5"/>

  <!-- Column headers -->
  <text x="46" y="141" class="section" fill="#fab283">SERVER</text>
  <rect x="46" y="156" width="289" height="25" fill="#1e1e1e" stroke="#484848"/>
  <text x="57" y="173" class="code">opencode.json / opencode.jsonc</text>
  <text x="46" y="205" class="body">Background server extensions</text>

  <text x="670" y="141" class="section" fill="#5c9cf5">TUI</text>
  <rect x="670" y="156" width="111" height="25" fill="#1e1e1e" stroke="#484848"/>
  <text x="681" y="173" class="code">cli.json</text>
  <text x="670" y="205" class="body">Interactive terminal UI extensions</text>

  <!-- Server: Adversarial Review -->
  <rect x="46" y="219" width="564" height="100" fill="#1e1e1e" stroke="#484848"/>
  <rect x="64" y="241" width="48" height="48" fill="#0a0a0a" stroke="#fab283" stroke-width="1.5"/>
  <path d="M78 250 H91 L98 257 V277 H78 Z M91 250 V257 H98 M83 264 H93 M83 270 H93" fill="none" stroke="#fab283" stroke-width="1.7"/>
  <path d="M130 237 V300" stroke="#484848"/>
  <text x="150" y="249" class="label">Adversarial Review</text>
  <text x="150" y="273" class="pkg">@capybearista/opencode-adversarial-review</text>
  <text x="150" y="298" class="small">Clean-context review commands</text>

  <!-- Server: Agents Loader -->
  <rect x="46" y="332" width="564" height="100" fill="#1e1e1e" stroke="#484848"/>
  <rect x="64" y="354" width="48" height="48" fill="#0a0a0a" stroke="#fab283" stroke-width="1.5"/>
  <path d="M88 366 L79 385 L97 385 Z" fill="none" stroke="#fab283" stroke-width="1.8"/>
  <circle cx="88" cy="366" r="3.3" fill="#fab283"/>
  <circle cx="79" cy="385" r="3.3" fill="#fab283"/>
  <circle cx="97" cy="385" r="3.3" fill="#fab283"/>
  <path d="M130 350 V413" stroke="#484848"/>
  <text x="150" y="362" class="label">Agents Loader</text>
  <text x="150" y="386" class="pkg">@capybearista/opencode-agents-loader</text>
  <text x="150" y="411" class="small">Bridges .agents/ commands and agents</text>

  <!-- Server: Output Styles (server + TUI from one entry) -->
  <rect x="46" y="445" width="564" height="100" fill="#1e1e1e" stroke="#9d7cd8" stroke-width="1.25"/>
  <rect x="64" y="467" width="48" height="48" fill="#0a0a0a" stroke="#9d7cd8" stroke-width="1.5"/>
  <path d="M75 479 H101 M75 491 H101 M75 503 H101" stroke="#9d7cd8" stroke-width="1.7"/>
  <rect x="82" y="475" width="7" height="8" fill="#9d7cd8"/>
  <rect x="94" y="487" width="7" height="8" fill="#9d7cd8"/>
  <rect x="78" y="499" width="7" height="8" fill="#9d7cd8"/>
  <path d="M130 463 V526" stroke="#484848"/>
  <text x="150" y="475" class="label">Output Styles</text>
  <text x="150" y="499" class="pkg">@capybearista/opencode-output-styles</text>
  <text x="150" y="524" class="small">Server + automatically loaded TUI</text>

  <!-- TUI: RAM Monitor -->
  <rect x="670" y="219" width="564" height="100" fill="#1e1e1e" stroke="#484848"/>
  <rect x="688" y="241" width="48" height="48" fill="#0a0a0a" stroke="#5c9cf5" stroke-width="1.5"/>
  <rect x="700" y="266" width="5" height="11" fill="#5c9cf5"/>
  <rect x="708" y="258" width="5" height="19" fill="#5c9cf5"/>
  <rect x="716" y="249" width="5" height="28" fill="#5c9cf5"/>
  <path d="M754 237 V300" stroke="#484848"/>
  <text x="774" y="249" class="label">RAM Monitor</text>
  <text x="774" y="273" class="pkg">@capybearista/opencode-ram-monitor</text>
  <text x="774" y="298" class="small">Sidebar widget + /ram modal</text>

  <!-- TUI: Double-Tap Timeline -->
  <rect x="670" y="332" width="564" height="100" fill="#1e1e1e" stroke="#484848"/>
  <rect x="688" y="354" width="48" height="48" fill="#0a0a0a" stroke="#5c9cf5" stroke-width="1.5"/>
  <circle cx="712" cy="378" r="14" fill="none" stroke="#5c9cf5" stroke-width="2"/>
  <path d="M712 369 V379 H721" stroke="#5c9cf5" stroke-width="2" fill="none"/>
  <path d="M754 350 V413" stroke="#484848"/>
  <text x="774" y="362" class="label">Double-Tap Timeline</text>
  <text x="774" y="386" class="pkg">@capybearista/opencode-double-tap-timeline</text>
  <text x="774" y="411" class="small">Open the timeline with two Escape presses</text>

  <!-- Explicit note: Output Styles is not a separate cli.json entry -->
  <rect x="670" y="445" width="564" height="100" fill="#18151d" stroke="#9d7cd8" stroke-width="1" stroke-dasharray="5 5"/>
  <text x="690" y="474" fill="#9d7cd8" font-size="14" font-weight="750">OUTPUT STYLES TUI: AUTO-LOADED</text>
  <path d="M690 485 H1214" stroke="#484848"/>
  <text x="690" y="507" class="body">Loads from the server package above.</text>
  <text x="690" y="530" class="small">Do not add Output Styles separately to cli.json.</text>

  <text x="640" y="588" class="small" text-anchor="middle">Choose only the plugins you want. Output Styles needs OpenCode 2.0.23+.</text>
</svg>
