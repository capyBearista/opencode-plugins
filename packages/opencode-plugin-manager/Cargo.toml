[package]
name = "oc-plugins"
version = "1.0.0"
edition = "2024"

[dependencies]
anyhow = "1.0.102"
clap = { version = "4.6.1", features = ["derive"] }
colored = "3.1.1"
directories = "6.0.0"
jsonc-parser = { version = "0.32.4", features = ["cst"] }
reqwest = { version = "0.13.3", features = ["json"] }
semver = "1.0.28"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
thiserror = "2.0.18"
tokio = { version = "1.52.3", features = ["full"] }

[dev-dependencies]
assert_cmd = "2.0.16"
insta = "1"
tempfile = "3.27.0"
